<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="小燕子的头像：天幕下的一只燕子">
  <defs>
    <linearGradient id="sky" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#cbe4ee"/>
      <stop offset="0.52" stop-color="#e8f3f2"/>
      <stop offset="1" stop-color="#fbf2e4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd6a2" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffd6a2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd6a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6d2d9" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#cfe2e0" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="round"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="400" height="400" fill="url(#sky)"/>

    <!-- 晨光 -->
    <circle cx="296" cy="98" r="96" fill="url(#sun)"/>
    <circle cx="296" cy="98" r="30" fill="#f6c489" opacity="0.5"/>

    <!-- 云 -->
    <g fill="#ffffff" opacity="0.55">
      <ellipse cx="96" cy="112" rx="54" ry="17"/>
      <ellipse cx="126" cy="104" rx="34" ry="14"/>
      <ellipse cx="302" cy="196" rx="46" ry="13" opacity="0.7"/>
    </g>

    <!-- 远处的屋檐 -->
    <path d="M0 322 Q 92 292 200 310 T 400 300 V400 H0 Z" fill="url(#hill)"/>
    <path d="M232 306 l58-14 58 14 -9 4 -49-10 -49 10z" fill="#8fb0b6" opacity="0.45"/>

    <!-- 柳枝 -->
    <g stroke="#8aa862" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M-6 46 C 58 78, 92 128, 104 196" stroke-width="2.6"/>
      <path d="M-6 62 C 40 92, 66 136, 72 194" stroke-width="2"/>
      <path d="M96 152 C 112 176, 118 202, 116 226" stroke-width="1.7"/>
    </g>
    <g fill="#93b06b" opacity="0.8">
      <ellipse cx="34" cy="80" rx="11" ry="4" transform="rotate(28 34 80)"/>
      <ellipse cx="62" cy="112" rx="10" ry="3.6" transform="rotate(36 62 112)"/>
      <ellipse cx="86" cy="158" rx="10" ry="3.6" transform="rotate(48 86 158)"/>
      <ellipse cx="100" cy="206" rx="9" ry="3.2" transform="rotate(64 100 206)"/>
      <ellipse cx="52" cy="96" rx="9" ry="3.2" transform="rotate(-24 52 96)"/>
      <ellipse cx="112" cy="182" rx="8" ry="3" transform="rotate(-58 112 182)"/>
    </g>

    <!-- 飞燕：剪影 -->
    <g fill="#2f5871">
      <g transform="translate(-2 100) scale(2.9)">
        <path d="M105 19c4-1 7 1 8 4 1 4-2 7-7 8-8 2-15 6-22 11L52 66l10-15-26 4 19-12c9-4 19-11 27-17 5-4 12-6 18-5z"/>
        <path d="M86 30C78 17 63 6 46 2c12 11 21 21 25 34z"/>
      </g>
    </g>

    <!-- 两只小燕 -->
    <g fill="#3b657f" opacity="0.55">
      <g transform="translate(278 50) scale(0.52)">
        <path d="M105 19c4-1 7 1 8 4 1 4-2 7-7 8-8 2-15 6-22 11L52 66l10-15-26 4 19-12c9-4 19-11 27-17 5-4 12-6 18-5z"/>
        <path d="M86 30C78 17 63 6 46 2c12 11 21 21 25 34z"/>
      </g>
      <g transform="translate(296 196) scale(0.38)" opacity="0.8">
        <path d="M105 19c4-1 7 1 8 4 1 4-2 7-7 8-8 2-15 6-22 11L52 66l10-15-26 4 19-12c9-4 19-11 27-17 5-4 12-6 18-5z"/>
        <path d="M86 30C78 17 63 6 46 2c12 11 21 21 25 34z"/>
      </g>
    </g>

    <!-- 高光 -->
    <rect width="400" height="400" fill="url(#sky)" opacity="0.08"/>
  </g>
</svg>
