# ============================================================
#  燕语 · 站点配置
#  技术栈：Jekyll + GitHub Pages（原生构建，零主题依赖）
#
#  写新文章：在 _posts/ 下新建  2026-11-01-your-title.md
#  改个人信息：往下找 owner / nav / social
# ============================================================

# ---------- 站点 ----------
title: 燕语
subtitle: 小燕子的檐下笔记
tagline: 衔一段春泥，筑一间小屋
description: 小燕子，江西科技师范大学学生。在这里存放学习笔记、生活碎片和读书摘抄 —— 一片一片，慢慢衔成一个巢。
author: 小燕子
email: ""
url: "https://www.xiaoyanzi0927.cc.cd"
baseurl: ""
timezone: Asia/Shanghai
encoding: utf-8
lang: zh-CN

# ---------- 作者 ----------
owner:
  name: 小燕子
  handle: 小燕子
  school: 江西科技师范大学
  city: 南昌
  major: 计算机相关专业
  bio: 江西科技师范大学在读，南昌。写字慢，但一直在写。
  github: xing05188
  avatar: /assets/img/avatar.svg
  # 建站日：用来算「在檐下住了多少天」
  since: 2026-03-20

# ---------- 导航 ----------
# 所有页面入口都列在这里，顺序＝显示顺序。
# 顶部一行放不下的部分会自动收进最后的「更多」下拉里；
# nav_max 控制最多在主栏显示几项（超过就折叠），nav_more_title 是下拉的小标题。
nav_max: 9
nav_more_title: 屋檐下还有
nav:
  - { name: 首页, url: "/", desc: "回到檐下，看看最近" }
  - { name: 笔记, url: "/notes/", desc: "课程、代码与学习记录" }
  - { name: 生活, url: "/life/", desc: "南昌的四季和日常" }
  - { name: 碎语, url: "/murmur/", desc: "一句话的念头" }
  - { name: 书架, url: "/shelf/", desc: "在读、读过与想读" }
  - { name: 关于, url: "/about/", desc: "关于小燕子" }
  - { name: 归档, url: "/archive/", desc: "按时间翻全部文章" }
  - { name: 标签, url: "/tags/", desc: "从一个词找到一片文章" }
  - { name: 友链, url: "/friends/", desc: "认识的朋友们" }
  - { name: 留言, url: "/guestbook/", desc: "在墙上留一句话" }
  - { name: 收藏, url: "/saved/", desc: "本机收藏夹" }
  - { name: 搜索, url: "/search/", desc: "全站检索一篇文章" }
  - { name: 工作台, url: "/studio/", desc: "写文章、改设置的后台" }

# ---------- 留言板（giscus，可选） ----------
# 想收到真留言：去 https://giscus.app/zh-CN 授权仓库，把下面几项填上，
# /guestbook/ 就会自动从「本地便签墙」切换成真正的留言区。
giscus:
  repo: ""
  repo_id: ""
  category: ""
  category_id: ""
  mapping: pathname
  theme: preferred_color_scheme

# ---------- 链接格式 ----------
permalink: /posts/:title/

# ---------- Markdown ----------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

highlighter: rouge

# ---------- 默认值 ----------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# ---------- 构建排除 ----------
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - scripts
  - .codebuddy
  - .gitignore

# ---------- 首页展示 ----------
home_posts_limit: 6
