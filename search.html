<h2>能搜到什么</h2>

<ul>
  <li>标题、摘要、标签、正文全文，都会参与匹配</li>
  <li>多个关键词用空格分开，比如「Python 笔记」</li>
  <li>按相关度排序：标题命中 &gt; 标签命中 &gt; 摘要命中 &gt; 正文命中</li>
</ul>
