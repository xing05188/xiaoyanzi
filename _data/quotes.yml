#  今日一句 —— 首页卡片随机取一条，点一下换一条
# ============================================================

- text: "燕子来时新社，梨花落后清明。"
  from: "晏殊《破阵子·春景》"
- text: "泥融飞燕子，沙暖睡鸳鸯。"
  from: "杜甫《绝句》"
- text: "无可奈何花落去，似曾相识燕归来。"
  from: "晏殊《浣溪沙》"
- text: "旧时王谢堂前燕，飞入寻常百姓家。"
  from: "刘禹锡《乌衣巷》"
- text: "几处早莺争暖树，谁家新燕啄春泥。"
  from: "白居易《钱塘湖春行》"
- text: "细雨鱼儿出，微风燕子斜。"
  from: "杜甫《水槛遣心》"
- text: "落花人独立，微雨燕双飞。"
  from: "晏几道《临江仙》"
- text: "燕子去了，有再来的时候；杨柳枯了，有再青的时候。"
  from: "朱自清《匆匆》"
- text: "纸上得来终觉浅，绝知此事要躬行。"
  from: "陆游《冬夜读书示子聿》"
- text: "读书之法，在循序而渐进，熟读而精思。"
  from: "朱熹《读书之要》"
- text: "好记性不如烂笔头。"
  from: "中国谚语"
- text: "我慢慢地、慢慢地了解到，所谓父女母子一场，只不过意味着，你和他的缘分就是今生今世不断地在目送他的背影渐行渐远。"
  from: "龙应台《目送》"
- text: "一个人只拥有此生此世是不够的，他还应该拥有诗意的世界。"
  from: "王小波《万寿寺》"
- text: "所有的故乡原本都是异乡，所谓故乡不过是我们祖先流浪的最后一站。"
  from: "王鼎钧"
- text: "生命是一袭华美的袍，爬满了蚤子。"
  from: "张爱玲《天才梦》"
- text: "我们终此一生，就是要摆脱他人的期待，找到真正的自己。"
  from: "伍绮诗《无声告白》"
- text: "把每一个平凡的日子，都过成自己想要的形状。"
  from: "檐下随笔"
- text: "写作不是为了被看见，是为了把想不清楚的事情想清楚。"
  from: "檐下随笔"
- text: "所谓成长，大概就是把「为什么是我」换成「那就这样吧」。"
  from: "檐下随笔"
- text: "慢慢来，比较快。"
  from: "檐下随笔"
- text: "春天是从第一只燕子开始的，不是从日历上开始的。"
  from: "檐下随笔"
- text: "人活得累，一是太认真，二是太想要。"
  from: "檐下随笔"
- text: "书到用时方恨少，事非经过不知难。"
  from: "陆游"
- text: "少年易老学难成，一寸光阴不可轻。"
  from: "朱熹《偶成》"
